name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show
      - name: Install search test dependency
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install ripgrep
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - name: Test
        run: cargo test --locked --all-targets
      - name: Lint and CLI acceptance on macOS
        if: runner.os == 'macOS'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked
          python3 tests/cli_ux.py
          python3 tests/connection_runtime.py
          python3 tests/shutdown.py
          python3 -m venv target/schema-tests
          target/schema-tests/bin/python -m pip install -r tests/requirements-schemas.txt
          target/schema-tests/bin/python tests/schemas.py
